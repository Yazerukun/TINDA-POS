name: TINDA POS Automated Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Artifacts
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Version
        id: version_step
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $rawVersion = $tag.TrimStart('v')
          Write-Output "Extracted Version: $rawVersion"
          echo "VERSION=$rawVersion" >> $env:GITHUB_ENV
          echo "TAG=$tag" >> $env:GITHUB_ENV

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Node Dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Run Quality Gate - Lint
        working-directory: source
        run: pnpm run lint

      - name: Run Quality Gate - Typecheck
        working-directory: source
        run: pnpm run typecheck

      - name: Run Quality Gate - Automated Tests
        working-directory: source
        run: pnpm test

      - name: Build Application Bundles
        working-directory: source
        run: pnpm run build

      - name: Package Windows Binaries (Setup & Portable)
        working-directory: source
        run: pnpm exec electron-builder --win --publish never

      - name: Setup Python for Artifact Validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Utilities
        run: python -m pip install pyyaml reportlab pypdf

      - name: Copy or Generate Release Documents
        shell: pwsh
        run: |
          $b = "source/builds"
          if (Test-Path "installers/TindaPOS-User-Guide.pdf") {
            Copy-Item "installers/TindaPOS-User-Guide.pdf" "$b/TindaPOS-User-Guide.pdf" -Force
          } elseif (Test-Path "docs/USER-MANUAL.md") {
            # Fallback if pre-built PDF isn't present
            python tools/gen_user_guide.py
            Copy-Item "installers/TindaPOS-User-Guide.pdf" "$b/TindaPOS-User-Guide.pdf" -Force
          }

      - name: Execute Automated Release Verification Gate
        run: |
          python tools/release_gate.py source/builds ${{ env.VERSION }}

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $b = "source/builds"
          $v = "${{ env.VERSION }}"
          $files = @(
            "$b/TindaPOS-Setup-$v.exe",
            "$b/TindaPOS-Portable-$v.exe",
            "$b/TindaPOS-Setup-$v.exe.blockmap",
            "$b/latest.yml",
            "$b/TindaPOS-User-Guide.pdf"
          )
          $lines = @()
          foreach ($f in $files) {
            if (Test-Path $f) {
              $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
              $name = Split-Path $f -Leaf
              $lines += "$hash  $name"
            }
          }
          $checksumFile = "$b/SHA256SUMS-v$v.txt"
          $lines | Set-Content -Path $checksumFile -Encoding utf8
          Write-Output "Generated Checksums:"
          Get-Content $checksumFile

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: TINDA POS ${{ env.TAG }} Stable
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            source/builds/TindaPOS-Setup-${{ env.VERSION }}.exe
            source/builds/TindaPOS-Portable-${{ env.VERSION }}.exe
            source/builds/TindaPOS-Setup-${{ env.VERSION }}.exe.blockmap
            source/builds/latest.yml
            source/builds/TindaPOS-User-Guide.pdf
            source/builds/SHA256SUMS-v${{ env.VERSION }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
